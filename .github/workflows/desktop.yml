name: Desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: windows-2022
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/desktop/gateway.test.cjs
      - run: pnpm --filter @know-gst/parity test
      - run: pnpm desktop:build --${{ matrix.target }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and test macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: KNOWGST_TEST_INSTALLER="$(find "$PWD/release" -maxdepth 1 -name '*.dmg' -print -quit)" pnpm desktop:test
      - name: Install and test Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KNOWGST_TEST_INSTALLER = (Get-ChildItem release/*.exe | Select-Object -First 1).FullName
          pnpm desktop:test
      - name: Checksums
        run: node scripts/desktop/checksums.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KNOWGST-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/SHA256SUMS
            release/smoke/
          if-no-files-found: error
